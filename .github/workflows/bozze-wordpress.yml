# Crea su WordPress una BOZZA per ogni articolo nuovo o modificato in
# blog-automatico/articoli/ e salva nel repository lo stato del sito.
# Gira sui server di GitHub: il PC può restare spento.
#
# Configurazione (una volta sola), in GitHub → Settings → Secrets and variables → Actions:
#   Secret    WP_APP_PASSWORD  password applicativa WordPress dedicata a GitHub
#   Variable  WP_URL           (facoltativa) default https://www.roccoandrealigorio.it
#   Variable  WP_USER          (facoltativa) default admin

name: Bozze WordPress

on:
  push:
    branches: [main]
    paths:
      - "blog-automatico/articoli/**"
  workflow_dispatch:
    inputs:
      cartella:
        description: "Cartella da (ri)pubblicare come bozza, es. blog-automatico/articoli/mio-articolo (vuoto = solo backup del sito)"
        required: false

permissions:
  contents: write

concurrency:
  group: bozze-wordpress
  cancel-in-progress: false

jobs:
  bozze:
    runs-on: ubuntu-latest
    env:
      WP_URL: ${{ vars.WP_URL || 'https://www.roccoandrealigorio.it' }}
      WP_USER: ${{ vars.WP_USER || 'admin' }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Controlla configurazione
        run: |
          if [ -z "$WP_APP_PASSWORD" ]; then
            echo "::error::Manca il secret WP_APP_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa Pillow (copertine)
        run: pip install --quiet pillow

      - name: Verifica accesso a WordPress
        working-directory: blog-automatico
        run: python pubblica.py verifica

      - name: Individua gli articoli da pubblicare
        id: articoli
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            elenco="${{ github.event.inputs.cartella }}"
          else
            prima="${{ github.event.before }}"
            if [ -z "$prima" ] || [ "$prima" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$prima^{commit}" 2>/dev/null; then
              prima=$(git hash-object -t tree /dev/null)
            fi
            elenco=$(git diff --name-only "$prima" "${{ github.sha }}" -- blog-automatico/articoli \
                     | awk -F/ 'NF>=4 {print $1"/"$2"/"$3}' | sort -u)
          fi
          finali=""
          for d in $elenco; do
            d="${d%/}"
            case "$d" in */_esempio) continue ;; esac
            [ -f "$d/meta.json" ] && [ -f "$d/articolo.html" ] && finali="$finali $d"
          done
          echo "Articoli: ${finali:-nessuno}"
          echo "elenco=$finali" >> "$GITHUB_OUTPUT"

      - name: Copertine e bozze
        if: steps.articoli.outputs.elenco != ''
        working-directory: blog-automatico
        run: |
          for d in ${{ steps.articoli.outputs.elenco }}; do
            rel="${d#blog-automatico/}"
            echo "::group::$rel"
            python copertina.py "$rel"
            python pubblica.py pubblica "$rel" --stato draft
            echo "::endgroup::"
          done

      - name: Backup degli articoli del sito nel repository
        working-directory: blog-automatico
        run: python pubblica.py scarica

      - name: Salva le modifiche nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-automatico/articoli
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Bozze WordPress: id, copertine e backup articoli [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Riepilogo
        if: always()
        run: |
          {
            echo "## Bozze WordPress"
            echo
            echo "Articoli elaborati: ${{ steps.articoli.outputs.elenco || 'nessuno' }}"
            echo
            echo "Controlla e approva le bozze: ${WP_URL}/wp-admin/edit.php?post_status=draft&post_type=post"
          } >> "$GITHUB_STEP_SUMMARY"
